name: Merge PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: "Auto Merge PR"
    runs-on: "ubuntu-latest"
    
    steps:
      - name: "Merge PR"
        uses: "actions/github-script@v7"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const pull_number = context.payload.pull_request ? context.payload.pull_request.number : null;
            if (!pull_number) {
              console.log("Không tìm thấy thông tin Pull Request.");
              return;
            }

            const repo = context.repo;

            // 1. Lấy thông tin chi tiết của PR
            const { data: pr } = await github.rest.pulls.get({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pull_number,
            });

            const creator = pr.user.login;

            // 2. Cho phép cả tài khoản của bạn lẫn bot tự động merge
            const allowedUsers = [
              "quoctuan21112009",
              "github-actions[bot]"
            ];

            if (!allowedUsers.includes(creator)) {
              console.log(`Bỏ qua vì PR #${pull_number} do ${creator} tạo, không nằm trong danh sách auto-merge.`);
              return;
            }

            // 3. Thực hiện merge
            console.log(`🔄 Đang merge PR #${pull_number} do ${creator} tạo...`);
            try {
              await github.rest.pulls.merge({
                owner: repo.owner,
                repo: repo.repo,
                pull_number: pull_number,
                merge_method: "merge",
                commit_title: `Auto-merge PR #${pull_number}`,
                commit_message: `Automatically merged by GitHub Actions workflow.`
              });
              console.log(`✅ Đã merge thành công PR #${pull_number}`);
            } catch (error) {
              console.log(`❌ Không thể merge PR #${pull_number}: ${error.message}`);
              throw error;
            }
