name: Achievement Collector - Update Progress

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/6 * * * *'  # Chạy mỗi 6 giờ
  workflow_dispatch:

# ✅ THÊM permissions
permissions:
  contents: write
  pull-requests: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub || echo "No dependencies needed"

      - name: 🚀 Execute Python script
        run: |
          python main.py || echo "No main.py found, creating sample..."
          # Nếu chưa có main.py, tạo file mẫu
          if [ ! -f "main.py" ]; then
            echo 'print("Hello from Python!")' > main.py
            echo "✅ Created sample main.py"
          fi

      - name: 📝 Check for changes
        id: check_changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Không có thay đổi để commit"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "✅ Có thay đổi sẽ được commit"
          fi

      - name: 🔄 Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          commit-message: "📊 Update achievement progress"
          title: "📊 Automated Achievement Update"
          body: |
            ## Achievement Progress Update
            
            This PR is automatically created by the Achievement Collector workflow.
            
            ### 📈 Changes:
            - Updated achievement progress data
            - Generated by GitHub Actions
            
            ### 🔄 Next steps:
            - Review the changes
            - Merge if everything looks good
          branch: update-progress
          base: main
          delete-branch: true
          labels: |
            automated
            achievement
          assignees: |
            quoctuan21112009-maker
